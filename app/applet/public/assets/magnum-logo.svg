<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Linear Metallic Gold Gradients -->
    <linearGradient id="magnumGoldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE899" />
      <stop offset="25%" stop-color="#DEB038" />
      <stop offset="50%" stop-color="#FDF0A6" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8F6205" />
    </linearGradient>

    <linearGradient id="magnumGoldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC658" />
      <stop offset="40%" stop-color="#FFF5C2" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C6F0A" />
    </linearGradient>

    <linearGradient id="magnumGoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECC554" />
      <stop offset="60%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#6B4702" />
    </linearGradient>

    <radialGradient id="goldShine" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBE0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7B5200" stop-opacity="0" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Canvas -->
  <rect width="500" height="400" fill="#050505" rx="24" />

  <!-- Background Soft Gold Radial Glow -->
  <circle cx="250" cy="180" r="150" fill="url(#goldShine)" opacity="0.18" />

  <!-- ==================== WINGED 'M' EMBLEM ==================== -->
  <g transform="translate(250, 185)">
    <!-- Circular Ring Arc (Open at left for wings) -->
    <path
      d="M -15 -92 A 118 118 0 1 1 -116 18"
      fill="none"
      stroke="url(#magnumGoldLinear)"
      stroke-width="13"
      stroke-linecap="round"
    />
    <path
      d="M -15 -92 A 118 118 0 1 1 -116 18"
      fill="none"
      stroke="url(#magnumGoldLight)"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.8"
    />
    <path
      d="M -22 -82 A 108 108 0 1 1 -106 12"
      fill="none"
      stroke="url(#magnumGoldDark)"
      stroke-width="2"
      opacity="0.6"
    />

    <!-- Multi-Layer Feathered Wings (Swept backwards to left) -->
    <!-- Feather 1 (Top Longest Feather) -->
    <path
      d="M -15 -92 C -75 -105 -150 -60 -185 -10 C -160 5 -125 -5 -85 -20 C -60 -30 -30 -50 -15 -92 Z"
      fill="url(#magnumGoldLight)"
    />
    <!-- Feather 2 -->
    <path
      d="M -50 -32 C -115 -35 -165 0 -178 30 C -150 32 -120 20 -80 0 C -65 -8 -55 -18 -50 -32 Z"
      fill="url(#magnumGoldLinear)"
    />
    <!-- Feather 3 -->
    <path
      d="M -60 -5 C -120 2 -155 35 -162 62 C -135 55 -110 38 -75 20 C -65 14 -60 5 -60 -5 Z"
      fill="url(#magnumGoldDark)"
    />
    <!-- Feather 4 (Bottom short feather) -->
    <path
      d="M -65 18 C -110 30 -138 60 -140 85 C -118 72 -98 52 -72 35 C -68 30 -65 24 -65 18 Z"
      fill="url(#magnumGoldLinear)"
    />

    <!-- Feather Highlights & Separation Ridges -->
    <path
      d="M -180 -8 C -135 -1 -80 -25 -20 -90"
      fill="none"
      stroke="#FFFBE0"
      stroke-width="2.5"
      opacity="0.8"
    />
    <path
      d="M -175 30 C -135 22 -95 6 -52 -30"
      fill="none"
      stroke="#FFFBE0"
      stroke-width="2"
      opacity="0.7"
    />
    <path
      d="M -160 62 C -125 45 -88 28 -62 0"
      fill="none"
      stroke="#FFEAA3"
      stroke-width="1.8"
      opacity="0.7"
    />

    <!-- Central Majestic Serif Letter 'M' -->
    <path
      d="M -52 68 L -52 -45 L -42 -45 L 8 40 L 16 40 L 66 -45 L 76 -45 L 76 68 L 62 68 L 62 -22 L 18 58 L 6 58 L -38 -22 L -38 68 Z"
      fill="url(#magnumGoldLinear)"
    />
    <!-- Metallic Bevel highlights on letter 'M' -->
    <polygon
      points="-52,-45 -42,-45 12,42 6,42"
      fill="url(#magnumGoldLight)"
    />
    <polygon
      points="66,-45 76,-45 76,68 68,68"
      fill="url(#magnumGoldLight)"
    />
    <polygon
      points="-38,-22 8,40 16,40 66,-45 62,-45 12,32"
      fill="url(#magnumGoldDark)"
      opacity="0.75"
    />
    <!-- Serif Base Feet -->
    <rect x="-58" y="64" width="26" height="5" rx="1.5" fill="url(#magnumGoldLight)" />
    <rect x="56" y="64" width="26" height="5" rx="1.5" fill="url(#magnumGoldLight)" />
    <!-- Serif Top Caps -->
    <rect x="-58" y="-48" width="20" height="4" rx="1" fill="url(#magnumGoldLight)" />
    <rect x="62" y="-48" width="20" height="4" rx="1" fill="url(#magnumGoldLight)" />
  </g>

  <!-- ==================== TYPOGRAPHY: MAGNUM ==================== -->
  <text
    x="250"
    y="355"
    font-family="'Cinzel', 'Times New Roman', 'Playfair Display', Georgia, serif"
    font-size="64"
    font-weight="800"
    letter-spacing="14"
    text-anchor="middle"
    fill="url(#magnumGoldLinear)"
    filter="url(#goldGlow)"
  >
    MAGNUM
  </text>
  <text
    x="250"
    y="354"
    font-family="'Cinzel', 'Times New Roman', 'Playfair Display', Georgia, serif"
    font-size="64"
    font-weight="800"
    letter-spacing="14"
    text-anchor="middle"
    fill="url(#magnumGoldLight)"
    opacity="0.9"
  >
    MAGNUM
  </text>
</svg>
